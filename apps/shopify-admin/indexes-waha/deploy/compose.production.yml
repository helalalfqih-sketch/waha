services:
  caddy:
    image: "${CADDY_IMAGE:?Set a pinned Caddy image tag or digest}"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set the public app domain}"
      DASHBOARD_DOMAIN: "${DASHBOARD_DOMAIN:?Set the private dashboard domain}"
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:?Set the dashboard username}"
      DASHBOARD_PASSWORD_HASH: "${DASHBOARD_PASSWORD_HASH:?Set the dashboard password hash}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - shopify-app
      - waha

  shopify-app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SHOPIFY_API_KEY: "${SHOPIFY_API_KEY:?Set the Shopify client ID}"
      SHOPIFY_API_SECRET: "${SHOPIFY_API_SECRET:?Set the Shopify client secret}"
      SHOPIFY_APP_URL: "${SHOPIFY_APP_URL:?Set the public HTTPS app URL}"
      SCOPES: "write_products,write_publications"
      DATABASE_URL: "file:/data/shopify.sqlite"
      SHOPIFY_ALLOWED_SHOP: "${SHOPIFY_ALLOWED_SHOP:?Set the allowed myshopify.com domain}"
      WAHA_BASE_URL: "http://waha:3000"
      WAHA_API_KEY: "${WAHA_API_KEY:?Set an independent WAHA API key}"
      WAHA_SESSION_NAME: "${WAHA_SESSION_NAME:-default}"
    volumes:
      - shopify_data:/data
    depends_on:
      - waha

  waha:
    image: "${WAHA_IMAGE:?Set a pinned WAHA Core image tag or digest}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY:?Set an independent WAHA API key}"
      WAHA_BASE_URL: "https://${DASHBOARD_DOMAIN:?Set the private dashboard domain}"
      WAHA_PUBLIC_URL: "https://${DASHBOARD_DOMAIN:?Set the private dashboard domain}"
      WAHA_DASHBOARD_ENABLED: "True"
      WAHA_DASHBOARD_USERNAME: "${DASHBOARD_USERNAME:?Set the dashboard username}"
      WAHA_DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?Set the dashboard password}"
      WHATSAPP_SWAGGER_ENABLED: "False"
      WAHA_PRINT_QR: "False"
      WHATSAPP_DEFAULT_ENGINE: "${WHATSAPP_DEFAULT_ENGINE:-WEBJS}"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_WORKER_RESTART_SESSIONS: "True"
      WAHA_AUTO_START_DELAY_SECONDS: "5"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

  tunnel-client:
    image: "${TUNNEL_CLIENT_IMAGE:?Set a pinned OpenAI tunnel-client image digest}"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    expose:
      - "8080"
    command:
      - "--control-plane.tunnel-id=${OPENAI_TUNNEL_ID:?Set the OpenAI secure tunnel ID}"
      - "--control-plane.api-key=file:/run/secrets/openai-runtime-api-key"
      - "--mcp.server-url=url=http://mcp-gateway:3001/mcp,channel=main"
      - "--health.listen-addr=:8080"
      - "--log.format=json"
    volumes:
      - ./.secrets/openai-runtime-api-key:/run/secrets/openai-runtime-api-key:ro
    depends_on:
      - mcp-gateway
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/readyz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp-gateway:
    image: "${WAHA_IMAGE:?Set a pinned WAHA Core image tag or digest}"
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    entrypoint:
      - node
    command:
      - /opt/mcp-gateway/server.mjs
    environment:
      MCP_GATEWAY_PORT: "3001"
      WAHA_BASE_URL: "http://waha:3000"
      WAHA_SEND_SESSION: "${WAHA_MCP_SEND_SESSION:-indexs}"
      WAHA_ADMIN_KEY_FILE: "/run/secrets/waha-admin-api-key"
    volumes:
      - ./mcp-gateway:/opt/mcp-gateway:ro
      - ./.secrets/waha-admin-api-key:/run/secrets/waha-admin-api-key:ro
    depends_on:
      - waha
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    pids_limit: 64

volumes:
  caddy_data:
  caddy_config:
  shopify_data:
  waha_sessions:
  waha_media:
