name: Shopify admin validation

on:
  push:
    paths:
      - 'apps/shopify-admin/indexes-waha/**'
      - '.github/workflows/shopify-admin.yml'
  pull_request:
    paths:
      - 'apps/shopify-admin/indexes-waha/**'
      - '.github/workflows/shopify-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shopify-admin/indexes-waha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate production Compose blueprint
        env:
          CADDY_IMAGE: caddy:validation
          WAHA_IMAGE: devlikeapro/waha:validation
          APP_DOMAIN: app.example.com
          SHOPIFY_APP_URL: https://app.example.com
          SHOPIFY_API_KEY: validation-client-id
          SHOPIFY_API_SECRET: validation-client-secret
          SHOPIFY_ALLOWED_SHOP: validation.myshopify.com
          WAHA_API_KEY: validation-waha-key
        run: docker compose -f deploy/compose.production.yml config --quiet
